[project]
name = "break-the-gate-api"
version = "0.1.0"
description = "Break the Gate API: gate engine, verifier, sessions and attempts."
requires-python = ">=3.11,<3.12"
dependencies = [
    "endor>=0.7,<0.8",
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S (bandit) flags subprocess, os.system, eval and exec on top of the grep test (PRD 4.1).
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
include = ["app", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real decision API; run manually with -m live",
]
